# Real-time demo: events stamped with wall-clock time, throttled, for watching the
# dashboard and pipeline-health page update while Spark processes the stream.
name: live_demo
description: Throttled real-time traffic for live dashboard demos.
seed: 5
tasks: 3000
workers: 2
time_mode: realtime
rate_per_sec: 20
workload_mix:
  - {agent_id: qa-assistant, version: "1.0.0", weight: 1}
  - {agent_id: qa-assistant, version: "1.1.0", weight: 1}
  - {agent_id: rag-helpdesk, version: "2.0.0", weight: 1}
  - {agent_id: rag-helpdesk, version: "2.1.0", weight: 1}
  - {agent_id: ops-tool-agent, version: "1.0.0", weight: 1}
  - {agent_id: ops-tool-agent, version: "1.1.0", weight: 1}
  - {agent_id: planner-agent, version: "1.0.0", weight: 1}
  - {agent_id: planner-agent, version: "2.0.0", weight: 1}
fault_profile:
  slow_tool: 0.006
  tool_timeout: 0.006
  loop: 0.005
  malformed_response: 0.004
  high_token_usage: 0.004
  failed_retrieval: 0.005
  suspicious_tool_access: 0.003
  policy_violation: 0.002
  prompt_injection: 0.003
  sensitive_data_leak: 0.002
  exfiltration_sequence: 0.002
  privilege_escalation: 0.002

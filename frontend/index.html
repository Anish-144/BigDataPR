<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AgentShield - AI agent testing, benchmarking, anomaly detection and security governance workbench" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AgentShield Workbench</title>
    <script>
      // Apply a pinned theme before first paint (no flash). Absent/blocked storage = follow the OS.
      try {
        var t = localStorage.getItem("agentshield.theme");
        if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

# AgentShield SPA + API reverse proxy.
# Resolve "backend" at request time via Docker's embedded DNS so nginx starts even if the
# backend container is not up yet (a plain proxy_pass hostname is resolved once at startup).
resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml text/csv text/markdown;
    gzip_min_length 1024;

    set $agentshield_backend http://backend:8000;

    # FastAPI backend. Some analytics endpoints run several Trino queries (30 s+), so timeouts are generous.
    location /api/ {
        proxy_pass $agentshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        proxy_buffering on;
        client_max_body_size 1m;
    }

    location = /health {
        proxy_pass $agentshield_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 30s;
    }

    # Hashed build assets can be cached forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA history fallback: unknown paths serve index.html (never cached so new builds are picked up).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

# Single-node Trino (coordinator also executes work).
coordinator=true
node-scheduler.include-coordinator=true
http-server.http.port=8080
discovery.uri=http://localhost:8080
# Explicit memory budget for a 1.5 GB heap: a query that needs more is killed with
# EXCEEDED_LOCAL_MEMORY_LIMIT instead of exhausting the JVM heap (which restarts the server).
query.max-memory=512MB
query.max-memory-per-node=512MB
memory.heap-headroom-per-node=384MB
# Large joins/aggregations spill to local disk instead of failing.
spill-enabled=true
spiller-spill-path=/tmp/trino-spill
max-spill-per-node=4GB
query-max-spill-per-node=2GB

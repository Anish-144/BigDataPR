# Apache Iceberg connector. The Iceberg catalog (table -> metadata pointer) is
# a JDBC catalog stored in PostgreSQL and shared with Spark (same catalog-name).
# Data/metadata files are Parquet/Avro/JSON objects on MinIO (S3 API).
connector.name=iceberg
iceberg.catalog.type=jdbc
iceberg.jdbc-catalog.catalog-name=lakehouse
iceberg.jdbc-catalog.driver-class=org.postgresql.Driver
iceberg.jdbc-catalog.connection-url=jdbc:postgresql://postgres:5432/${ENV:ICEBERG_CATALOG_DB}
iceberg.jdbc-catalog.connection-user=${ENV:ICEBERG_CATALOG_USER}
iceberg.jdbc-catalog.connection-password=${ENV:ICEBERG_CATALOG_PASSWORD}
iceberg.jdbc-catalog.default-warehouse-dir=s3://warehouse/
iceberg.file-format=PARQUET
iceberg.compression-codec=ZSTD

fs.native-s3.enabled=true
s3.endpoint=http://minio:9000
s3.region=us-east-1
s3.path-style-access=true
s3.aws-access-key=${ENV:MINIO_ROOT_USER}
s3.aws-secret-key=${ENV:MINIO_ROOT_PASSWORD}
